# =====================================================================
# soul_trail 前端 H5 静态托管 + (可选) /api 反代
# 适用：uni-app H5 build 产物 (frontend/heart/dist) 上传到阿里云 ECS
# 部署路径建议：/etc/nginx/conf.d/soul_trail.conf
# 前端静态目录：/opt/soul_trail/frontend/
# 后端监听：    127.0.0.1:8080  (与 nginx 同机)
# =====================================================================

# 后端 upstream（仅在启用 /api 反代时使用）
upstream soul_trail_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    # listen 443 ssl;   # TODO: 上 HTTPS 时打开，并配 ssl_certificate / ssl_certificate_key
    server_name _;      # 没有域名时用 _，有域名改成你的域名

    # ---------- 静态目录 ----------
    # 部署时把 heart/dist/* 整个上传到这里
    root /opt/soul_trail/frontend;
    index index.html;

    access_log /var/log/nginx/soul_trail.access.log;
    error_log  /var/log/nginx/soul_trail.error.log;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/svg+xml text/javascript
               font/ttf font/otf image/svg+xml;

    # ---------- 静态资源长缓存 ----------
    location ~* \.(?:js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---------- SPA / 静态首页 fallback ----------
    # uni-app 默认 hash 路由，留着也没坏处；以后切 history 路由也直接兼容
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # (可选) /api 反代到后端
    # 场景：你想把前端 src/utils/request.js 的 baseURL 从
    #       'http://121.43.104.168:8080' 改成相对路径 '/api'
    # 启用方法：去掉下面这块的注释，并同步改前端 baseURL
    # ============================================================
    # location /api/ {
    #     proxy_pass http://soul_trail_backend;   # 注意：proxy_pass 末尾不带 / 才能保留 /api 前缀
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection        "";
    #     proxy_read_timeout 60s;
    # }

    # ---------- 安全：禁止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}